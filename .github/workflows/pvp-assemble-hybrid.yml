name: Assemble hybrid PvP implementation
on:
  push:
    branches: [feature/online-pvp-30tps]
    paths: [.github/workflows/pvp-assemble-hybrid.yml]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify and assemble recovered sources
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, re, shutil
          root = pathlib.Path('.')
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          def apply(entries):
              for item in entries:
                  name = item['path']
                  p = pathlib.PurePosixPath(name)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert name == '.github/workflows/pvp-ci.yml' or name.startswith(('src/main/java/online/', 'src/test/', 'distribution/', 'tools/', 'docs/')), name
                  target = root / p
                  assert not target.is_symlink()
                  actual = blob(target.read_bytes()) if target.exists() else None
                  assert actual == item['expected'], (name, actual, item['expected'])
                  if item['content'] is None:
                      target.unlink()
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(item['content'].encode('utf-8'))
                      target.chmod(0o755 if name.endswith('.sh') else 0o644)
                  print('Applied:', name)
          raw = base64.b64decode(''.join((root / f'.pvp-transfer/hybrid-{i}.b64').read_text().strip() for i in range(3)), validate=True)
          text = lzma.LZMADecompressor().decompress(raw).decode('utf-8', errors='ignore')
          assert text.startswith('{"base":"fd5c5833484b703d222460484bf8c2f9b72f7b4b"')
          cursor = re.search(r'"files"\s*:\s*\[', text).end()
          decoder = json.JSONDecoder()
          entries = []
          while True:
              while cursor < len(text) and text[cursor] in ', \r\n\t': cursor += 1
              try: entry, end = decoder.raw_decode(text, cursor)
              except json.JSONDecodeError: break
              entries.append(entry); cursor = end
          assert len(entries) == 21, len(entries)
          apply(entries)
          raw = base64.b64decode(''.join((root / f'.pvp-transfer/continue-{i}.b64').read_text().strip() for i in range(9)), validate=True)
          assert hashlib.sha256(raw).hexdigest() == 'ab50c90f82f16d0549c4a03e0b75707dcf6548e581f226c07a728985ad4a136e', 'Continuation checksum mismatch'
          manifest = json.loads(lzma.decompress(raw))
          assert manifest['base'] == 'cbcad11c987b200cc2339655d624505e1f43655a'
          assert len(manifest['files']) == 37
          apply(manifest['files'])
          shutil.rmtree(root / '.pvp-transfer')
          (root / '.github/workflows/pvp-recover.yml').unlink(missing_ok=True)
          (root / '.github/workflows/pvp-assemble-hybrid.yml').unlink(missing_ok=True)
          print('Hybrid source assembly complete; 21 recovered and 37 continuation records verified.')
          PY
          test "$(git -C src/main/java/common rev-parse HEAD)" = 8920447e73bea56289a2da5a2a9294e24ff08c67
          git diff --check
      - name: Clean Maven build and hybrid integration tests
        run: |
          set -o pipefail
          mkdir -p diagnostics
          mvn -B -ntp clean verify dependency:copy-dependencies -DoutputDirectory=target/lib 2>&1 | tee diagnostics/assembly-maven.log
          python3 tools/test-package-pvp.py
      - name: Commit verified implementation and remove transfer scaffolding
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/online src/test tools distribution docs .github/workflows
          git add -u .pvp-transfer
          git diff --cached --quiet -- src/main/java/common
          git commit -m 'feat: add authenticated UDP lockstep, multiplayer-ready rooms and friend server hosting'
          git push origin HEAD:feature/online-pvp-30tps
          git rev-parse HEAD > diagnostics/assembled-commit.txt
      - name: Build verified portable distribution
        run: |
          bash tools/package-pvp.sh
          java -cp 'target/bcu-pvp-portable/bcu-pvp.jar:target/bcu-pvp-portable/lib/*' online.net.PvpServerMain --check-config distribution/pvp-server.properties
      - name: Preserve source checkpoint
        if: always()
        run: tar --exclude=.git --exclude=target --exclude=build --exclude=.gradle --exclude=__pycache__ -czf "$RUNNER_TEMP/hybrid-assembled-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybrid-assembly
          path: |
            diagnostics/
            ${{ runner.temp }}/hybrid-assembled-source.tar.gz
            target/bcu-pvp-portable.zip
            target/bcu-pvp-portable.zip.sha256
          retention-days: 7
