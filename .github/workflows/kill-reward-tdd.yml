name: Publish verified PvP defeat reward protocol
on:
  push:
    branches: [work/kill-reward]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 66b23f91c1b651fcabed4f7cc6d42f792b0ce5b3
      - name: Apply already-verified v4 compatibility changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/main/java/online/net/Protocol.java'); s=p.read_text(); s=s.replace('VERSION=3','VERSION=4',1).replace('bcu-pvp-3-core-8920447','bcu-pvp-4-core-8920447',1); p.write_text(s)
          p=Path('docs/ONLINE_PVP_JA.md'); s=p.read_text(); s=s.replace('protocol v3','protocol v4',1).replace('今回の通信はv3です。旧テスト版とは互換性がないため','今回の通信はv4です。旧v3テスト版とは互換性がないため',1); p.write_text(s)
          p=Path('tools/verify-pvp-package.py'); s=p.read_text(); s=s.replace('essential v3 classes','essential v4 classes',1); p.write_text(s)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/online/net/Protocol.java docs/ONLINE_PVP_JA.md tools/verify-pvp-package.py
          git commit -m 'chore: bump PvP protocol for defeat reward rule'
          git push origin HEAD:refs/heads/work/kill-reward-v4 --force
