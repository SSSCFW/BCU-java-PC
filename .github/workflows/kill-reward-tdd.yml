name: PvP defeat reward TDD
on:
  push:
    branches: [work/kill-reward]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: PvP integration tests
        run: mvn -B -ntp clean verify
