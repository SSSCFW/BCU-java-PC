# Java 21. Shared by the in-game friend-server button and the dedicated launcher.
# This binds all interfaces; restrict your firewall to friends/LAN/VPN as appropriate.
bind=0.0.0.0
controlPort=8766
udpPort=8767
udpEnabled=true
# Empty: clients use the control URL's hostname for UDP. For reverse proxies/CDNs,
# set a directly reachable UDP hostname/IP here (UDP is NOT proxied by ordinary WSS).
udpHost=
maxRooms=32
maxConnections=128
# Technical capacity, NOT the number of players in the playable DUEL_1V1 mode.
maxParticipantsPerRoom=8
roomIdleMinutes=10
bundleMaxMiB=32
# Negotiated once at match start: 3..8 ticks (30 TPS).
inputDelayTicks=3
# Selects friend-oriented startup guidance, not weaker authentication/encryption.
friendsMode=true
